name: Rewards security checks

on:
  push:
    branches: [secure-bible-challenge-integration, end-to-end-test-setup]
    paths:
      - "functions/**"
      - ".github/workflows/rewards-security-checks.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/rewards-security-checks.yml"

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install function dependencies
        working-directory: functions
        run: npm install --ignore-scripts
      - name: Run evaluator tests
        working-directory: functions
        run: npm test
      - name: Check backend syntax
        working-directory: functions
        run: node --check index.js && node --check answer-evaluator.js && node --check integration.test.js && node --check seed-emulator.js && node --check ../app.js && node --check ../firebase-config.js
      - name: Run Firebase emulator integration test
        run: functions/node_modules/.bin/firebase emulators:exec --project demo-ava-rewards --only auth,firestore,functions "cd functions && npm run test:integration"
